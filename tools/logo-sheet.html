<!doctype html>
<meta charset="utf-8">
<title>Logo sheet</title>
<style>
  body { margin: 0; padding: 24px; background: #e9ebf2; font: 14px system-ui; display: grid; gap: 24px; }
  .row { display: flex; gap: 24px; align-items: end; flex-wrap: wrap; padding: 20px; border-radius: 16px; }
  .dark { background: #080b16; color: #fff; }
  .light { background: #fff; }
  img { display: block; }
  .round img { border-radius: 50%; }
</style>
<div class="row light"><img src="../icons/icon.svg" width="256"><img src="../icons/icon.svg" width="96"><img src="../icons/icon.svg" width="48"><img src="../icons/icon.svg" width="32"><img src="../icons/icon.svg" width="16"></div>
<div class="row dark"><img src="../icons/icon.svg" width="256"><img src="../icons/icon.svg" width="96"><img src="../icons/icon.svg" width="48"><img src="../icons/icon.svg" width="32"><img src="../icons/icon.svg" width="16"></div>
<div class="row dark round"><img src="../icons/icon.svg" width="120"><img src="../icons/icon.svg" width="64"></div>
