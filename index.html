<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Light</title>
  <meta name="description" content="Light — your daily guide for focus, health, money, character and joy." />
  <meta name="theme-color" content="#080b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Light" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply the saved theme before first paint (no flash of the wrong colors).
    try {
      var s = (JSON.parse(localStorage.getItem('light.v1')) || {}).settings || {};
      var t = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (s.theme || 'dark');
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.accent = s.accent || 'sunrise';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div id="app">
    <nav id="nav" aria-label="Main"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <a href="#view" class="skip-link">Skip to content</a>
  <button id="sos" class="sos hide" aria-label="I have an urge — get help now">Urge?</button>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <noscript><p style="padding:24px">Light needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
